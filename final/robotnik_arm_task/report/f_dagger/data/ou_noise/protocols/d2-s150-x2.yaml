# DART noise protocol d2-s150-x2 (overnight3): d2-s075-x2 with arm sigma 1.5 N*m, wheel sigma 0.3 rad/s, 2 draws.
protocol: d2-s150-x2
teacher: A
scenarios:
  source: data/Markovian/Clean_253/scenarios_train.csv
  split_manifest: experiments/splits/clean253.json
  ids: fitting_ids.clean253
draws_per_scenario: 2
seed: 20261028
noise:
  type: ou
  tau_s: 0.2
  alpha: [0.25, 1.0]
  arm_sigma_nm: 1.5
  wheel_sigma_rad_s: 0.3
  wheel_off: first_reach_active
  all_off_after_reach_s: 1.5
