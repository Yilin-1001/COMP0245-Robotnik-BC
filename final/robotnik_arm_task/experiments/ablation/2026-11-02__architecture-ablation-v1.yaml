# Architecture ablation v1: what does the network size alone do to R4, R6 and R8? (lightweight direction)
# Design: docs/superpowers/specs/2026-11-02-architecture-ablation-design.md
# Run with: python -m experiments.ablation.run --manifest experiments/ablation/2026-11-02__architecture-ablation-v1.yaml \
#           [--rows <row> ...] [--stage train|validate|hold|summary]
# Only the architecture varies: data (option A, the round-3 aggregates), recipe and lambda_J (copied from each row's
# 256x3 seed-0 run) are fixed. The 256x3 models are references: evaluated here, never retrained.
experiment: architecture-ablation
version: v1
date: 2026-11-02
architectures:                    # experiments/configs/datasets/base.yaml
  - MLP02                         # 32x3
  - MLP03                         # 64x2
  - MLP04                         # 64x3
  - MLP05                         # 64x4
  - MLP06                         # 128x3
  - MLP07                         # 256-128-64
  - MLP08                         # 256x2
  - MLP09                         # 256x4
  - MLP10                         # 512x3
rows:
  - R4-dart-gate                  # clean + DART
  - R6-gate-dagger-r3             # clean + DAgger rounds 1-3 (collected by the 256x3 R6 students)
  - R8-dart-gate-dagger-r3        # clean + DART + DAgger rounds 1-3
seeds: [0, 1, 2]
recipe:                           # the frozen v1/v2 recipe
  identity.objective: bcj
  training.lr: 1.0e-3
  training.updates: 42000
  loss.action: huber
  loss.arm_weight: 0.5
  loss.wheel_weight: 0.5
lr_by_architecture:               # per-architecture lr from the R4 seed-0 validation screen (results/ablation/
  MLP02: 1.0e-2                   #   2026-11-02__architecture-ablation-v1/lr_screen.md); shared by all rows and seeds;
  MLP03: 1.0e-2                   #   MLP02/MLP03 sit at the top of the screened range (limitation)
  MLP04: 1.0e-3
  MLP05: 1.0e-3
  MLP06: 1.0e-3
  MLP07: 3.0e-3
  MLP08: 1.0e-3
  MLP09: 3.0e-3
  MLP10: 1.0e-3
lambda_j_source:                  # lambda_J copied from these runs (same variant, data and normaliser; checked)
  R4-dart-gate: checkpoints/ablation/2026-10-28__training-ablation-v1/R4-dart-gate__MLP01-256x3__s0__v1__2026-10-28/config.yaml
  R6-gate-dagger-r3: checkpoints/ablation/2026-11-01__training-ablation-v2/R6-gate-dagger-r3__MLP01-256x3__s0__v2__2026-11-01/config.yaml
  R8-dart-gate-dagger-r3: checkpoints/ablation/2026-11-01__training-ablation-v2/R8-dart-gate-dagger-r3__MLP01-256x3__s0__v2__2026-11-01/config.yaml
references:                       # existing 256x3 terminal models; {seed} is substituted
  R4-dart-gate: checkpoints/ablation/2026-10-28__training-ablation-v1/R4-dart-gate__MLP01-256x3__s{seed}__v1__2026-10-28/R4-dart-gate__MLP01-256x3__s{seed}__v1__2026-10-28.npz
  R6-gate-dagger-r3: checkpoints/ablation/2026-11-01__training-ablation-v2/R6-gate-dagger-r3__MLP01-256x3__s{seed}__v2__2026-11-01/R6-gate-dagger-r3__MLP01-256x3__s{seed}__v2__2026-11-01.npz
  R8-dart-gate-dagger-r3: checkpoints/ablation/2026-11-01__training-ablation-v2/R8-dart-gate-dagger-r3__MLP01-256x3__s{seed}__v2__2026-11-01/R8-dart-gate-dagger-r3__MLP01-256x3__s{seed}__v2__2026-11-01.npz
evaluation:                       # as ablation v1
  checkpoint: terminal
  validation_modes: [student, arm]
  hold_test_scenarios: [train-0001, train-0035, train-0067, train-0108, train-0142, train-0178, train-0216, train-0255]
  primary_metric: sustained hold on the 240-scene unified test suite (evaluation.test_suite --models), seeds pooled
  test: unified-test-v1 via evaluation.test_suite --models; reported only, never used to choose anything
